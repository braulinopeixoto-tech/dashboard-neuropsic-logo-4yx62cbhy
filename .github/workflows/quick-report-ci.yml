name: Quick Report CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - test/quick-report-engine

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build app
        run: npm run build

      - name: Run Quick Report tests
        run: npm test -- --run
